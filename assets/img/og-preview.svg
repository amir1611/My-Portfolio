<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="80" y="80" width="6" height="80" rx="3" fill="url(#accent)"/>

  <!-- Name -->
  <text x="108" y="135" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Amir Ali</text>

  <!-- Dot -->
  <text x="336" y="135" font-family="Inter, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#3b82f6">.</text>

  <!-- Role -->
  <text x="108" y="195" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Product Manager</text>

  <!-- Divider -->
  <rect x="80" y="240" width="500" height="1" fill="#334155"/>

  <!-- Description -->
  <text x="80" y="290" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#64748b">Building impactful B2B SaaS products across</text>
  <text x="80" y="325" font-family="Inter, -apple-system, sans-serif" font-size="22" fill="#64748b">HRTech · FinTech · EdTech</text>

  <!-- Tags -->
  <rect x="80" y="390" width="120" height="38" rx="19" fill="#1e3a8a" opacity="0.6"/>
  <text x="140" y="414" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle">HRTech</text>

  <rect x="214" y="390" width="120" height="38" rx="19" fill="#1e3a8a" opacity="0.6"/>
  <text x="274" y="414" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle">FinTech</text>

  <rect x="348" y="390" width="120" height="38" rx="19" fill="#1e3a8a" opacity="0.6"/>
  <text x="408" y="414" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#60a5fa" text-anchor="middle">EdTech</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#475569">amirali.netlify.app</text>

  <!-- Decorative circle -->
  <circle cx="1050" cy="315" r="220" fill="#2563eb" opacity="0.06"/>
  <circle cx="1050" cy="315" r="160" fill="#2563eb" opacity="0.06"/>
  <circle cx="1050" cy="315" r="100" fill="#2563eb" opacity="0.08"/>

  <!-- Rocket icon approximation -->
  <text x="1010" y="340" font-family="serif" font-size="80" fill="#3b82f6" opacity="0.4">🚀</text>
</svg>
